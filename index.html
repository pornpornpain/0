<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>0</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --link: #0b57d0;
      --border: #dddddd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #252628;
        --text: #d1d5db;
        --link: #8ab4f8;
        --border: #57585a;
      }
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1rem;
      line-height: 1.6;
    }
    a { color: var(--link); }
    hr { border-color: var(--border); }
  </style>
</head>
<body>
  <p>Reproductive organs are an impurity, and I, born with them, am an impure being.</p>
</body>
</html>
